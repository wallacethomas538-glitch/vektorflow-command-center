  </head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/80 backdrop-blur-xl shadow-[0_4px_24px_rgba(0,0,0,0.6)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><img alt="VektorFlow Logo" class="h-8 w-auto object-contain shrink-0" src="../assets/vektorflow-logo-pro.webp"/><div class="flex flex-col min-w-0"><div class="flex items-center gap-space-xs"><span class="font-headline-sm text-headline-sm tracking-wider uppercase text-primary truncate">VEKTORFLOW</span><div class="h-1.5 w-1.5 rounded-full bg-tertiary-container animate-pulse shadow-[0_0_8px_#22ef7e]"></div></div><span class="font-label-mono-sm text-label-mono-sm uppercase text-outline tracking-widest truncate">SYS: Ads</span></div></div><div class="flex items-center gap-space-sm shrink-0"><div class="flex items-center gap-space-xs bg-surface-container px-space-xs py-0.5 rounded-full shadow-[inset_0_1px_0_0_rgba(0,229,255,0.15)]"><span class="font-label-mono-sm text-label-mono-sm text-tertiary-fixed-dim uppercase px-1">ONLINE</span></div><div class="relative flex items-center justify-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover shadow-[0_0_10px_rgba(0,229,255,0.25)]" src="../assets/vektormind-avatar.png"/><div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-tertiary-container rounded-full ring-2 ring-surface-container-lowest"></div></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-28 bg-surface"><div class="flex flex-col w-full px-margin space-y-space-md"><!-- Tactical Header -->
<div class="flex items-end justify-between pt-space-sm">
<div class="flex flex-col">
<div class="flex items-center gap-space-xs text-primary-fixed-dim">
<span class="material-symbols-outlined text-[16px] animate-pulse">photo_library</span>
<span class="font-label-mono-sm text-label-mono-sm tracking-widest uppercase">CREATIVE // POLLINATIONS</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight uppercase">AD CREATOR</h2>
</div>
</div>
<!-- Ad Brief Form -->
<div class="rounded-2xl bg-surface-container/70 backdrop-blur-md p-space-md shadow-[0_8px_32px_0_rgba(0,0,0,0.45)] flex flex-col gap-space-sm">
<label class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-wider" for="ad-product">Product</label>
<input id="ad-product" type="text" placeholder="e.g. CloudSync wireless earbuds" class="w-full bg-surface-container-lowest rounded-xl p-space-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" style="border: 1px solid rgba(0,229,255,0.2);"/>
<label class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-wider" for="ad-headline">Ad headline</label>
<input id="ad-headline" type="text" placeholder="e.g. Silence the world, keep the beat" class="w-full bg-surface-container-lowest rounded-xl p-space-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" style="border: 1px solid rgba(0,229,255,0.2);"/>
<label class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-wider">Style preset</label>
<div class="grid grid-cols-3 gap-space-xs" id="style-presets">
<button type="button" data-style="product" onclick="setStyle('product', this)" class="style-btn py-2 rounded-xl bg-primary-container/15 text-primary-container font-label-mono-sm text-label-mono-sm tracking-wider">PRODUCT PHOTO</button>
<button type="button" data-style="promo" onclick="setStyle('promo', this)" class="style-btn py-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-mono-sm text-label-mono-sm tracking-wider">BOLD PROMO</button>
<button type="button" data-style="minimal" onclick="setStyle('minimal', this)" class="style-btn py-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-mono-sm text-label-mono-sm tracking-wider">MINIMAL</button>
</div>
<label class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-wider" for="ad-extra">Extra details <span class="text-outline-variant">(optional)</span></label>
<textarea id="ad-extra" rows="2" placeholder="Colors, mood, setting, props…" class="w-full bg-surface-container-lowest rounded-xl p-space-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" style="border: 1px solid rgba(0,229,255,0.2);"></textarea>
<label class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-wider" for="ad-key">Pollinations API key <span class="text-outline-variant">(optional — higher limits)</span></label>
<input id="ad-key" type="password" placeholder="Saved on this device only" class="w-full bg-surface-container-lowest rounded-xl p-space-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" style="border: 1px solid rgba(0,229,255,0.2);"/>
<button class="w-full h-12 rounded-xl bg-primary-container text-on-primary-container font-headline-sm text-headline-sm font-bold shadow-[0_0_16px_rgba(0,229,255,0.35)] active:scale-[0.99] transition-transform flex items-center justify-center gap-2" id="ad-generate-btn" onclick="generateAd()" type="button">
<span class="material-symbols-outlined text-[20px]">auto_awesome</span>
<span>GENERATE AD</span>
</button>
</div>
<!-- Ad Output -->
<div id="ad-output" class="flex flex-col gap-space-sm"></div>
<!-- Ad Wiring (Pollinations.ai image API) -->
<script>
    var currentStyle = 'product';
    var currentUrl = '';
    var STYLE_SUFFIX = {
      product: 'professional product photography, studio lighting, clean background, high-end commercial shot',
      promo: 'bold advertising poster, vibrant colors, dynamic composition, striking marketing design',
      minimal: 'minimalist ad design, lots of negative space, elegant premium feel, refined composition'
    };
    function setStyle(style, btn) {
      currentStyle = style;
      document.querySelectorAll('.style-btn').forEach(function (el) {
        el.className = 'style-btn py-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-mono-sm text-label-mono-sm tracking-wider';
      });
      btn.className = 'style-btn py-2 rounded-xl bg-primary-container/15 text-primary-container font-label-mono-sm text-label-mono-sm tracking-wider';
    }
    function getKey() {
      try { return document.getElementById('ad-key').value.trim() || localStorage.getItem('vf_pollinations_key') || ''; }
      catch (e) { return document.getElementById('ad-key').value.trim(); }
    }
    function saveKey(k) {
      try { if (k) localStorage.setItem('vf_pollinations_key', k); } catch (e) {}
    }
    (function initKey() {
      try {
        var k = localStorage.getItem('vf_pollinations_key');
        if (k) document.getElementById('ad-key').value = k;
      } catch (e) {}
    })();
    function buildAdUrl(seed) {
      var product = document.getElementById('ad-product').value.trim();
      var headline = document.getElementById('ad-headline').value.trim();
      var extra = document.getElementById('ad-extra').value.trim();
      var key = getKey();
      if (key) saveKey(key);
      var prompt = 'Advertisement creative for ' + product;
      if (headline) prompt += ', headline concept: "' + headline + '"';
      prompt += '. ' + STYLE_SUFFIX[currentStyle] + '.';
      if (extra) prompt += ' ' + extra;
      var url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt)
        + '?width=1080&height=1350&nologo=true&model=flux&seed=' + seed;
      if (key) url += '&key=' + encodeURIComponent(key);
      return url;
    }
    function generateAd() {
      var product = document.getElementById('ad-product').value.trim();
      var out = document.getElementById('ad-output');
      var btn = document.getElementById('ad-generate-btn');
      if (!product) {
        out.innerHTML = '<div class="p-space-md text-error font-label-mono-sm text-label-mono-sm">Name the product first.</div>';
        return;
      }
      var seed = Math.floor(Math.random() * 1000000);
      currentUrl = buildAdUrl(seed);
      btn.disabled = true;
      out.innerHTML = '<div class="rounded-2xl bg-surface-container-low p-space-md shadow-md flex flex-col items-center gap-space-sm">'
        + '<div class="w-8 h-8 rounded-full border-2 border-primary-container border-t-transparent animate-spin"></div>'
        + '<div class="font-label-mono-sm text-label-mono-sm text-primary-container tracking-widest">GENERATING…</div>'
        + '<div class="font-label-mono-sm text-label-mono-sm text-outline">Pollinations can take 20–60 seconds.</div></div>';
      var img = new Image();
      img.onload = function () {
        btn.disabled = false;
        out.innerHTML = '<div class="rounded-2xl bg-surface-container/70 backdrop-blur-md p-space-md shadow-[0_8px_32px_0_rgba(0,0,0,0.45)] flex flex-col gap-space-sm">'
          + '<img src="' + currentUrl.replace(/"/g, '&quot;') + '" alt="Generated ad creative" class="w-full rounded-xl object-cover"/>'
          + '<div class="grid grid-cols-3 gap-space-xs">'
          + '<button onclick="downloadAd()" class="h-11 rounded-xl bg-surface-container-low text-primary-container flex items-center justify-center gap-1 font-label-mono-md text-label-mono-md tracking-wider active:bg-surface-container-high transition-colors" type="button"><span class="material-symbols-outlined text-[18px]">download</span>DOWNLOAD</button>'
          + '<button onclick="copyAdUrl()" class="h-11 rounded-xl bg-surface-container-low text-primary-container flex items-center justify-center gap-1 font-label-mono-md text-label-mono-md tracking-wider active:bg-surface-container-high transition-colors" type="button"><span class="material-symbols-outlined text-[18px]">link</span>COPY URL</button>'
          + '<button onclick="generateAd()" class="h-11 rounded-xl bg-surface-container-low text-primary-container flex items-center justify-center gap-1 font-label-mono-md text-label-mono-md tracking-wider active:bg-surface-container-high transition-colors" type="button"><span class="material-symbols-outlined text-[18px]">refresh</span>REGENERATE</button>'
          + '</div>'
          + '<div id="ad-msg" class="font-label-mono-sm text-label-mono-sm text-outline"></div>'
          + '</div>';
      };
      img.onerror = function () {
        btn.disabled = false;
        out.innerHTML = '<div class="p-space-md text-error font-label-mono-sm text-label-mono-sm">Image generation failed — <button class="underline text-primary-container" onclick="generateAd()">try again</button><div class="text-outline mt-1">Pollinations may be rate-limited; wait a minute and retry.</div></div>';
      };
      img.src = currentUrl;
    }
    function downloadAd() {
      var msg = document.getElementById('ad-msg');
      fetch(currentUrl).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      }).then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vektorflow-ad-' + Date.now() + '.jpg';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        if (msg) msg.textContent = 'Downloaded.';
      }).catch(function () {
        window.open(currentUrl, '_blank');
        if (msg) msg.textContent = 'Opened in new tab — long-press to save.';
      });
    }
    function copyAdUrl() {
      var msg = document.getElementById('ad-msg');
      function done() { if (msg) msg.textContent = 'URL copied.'; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentUrl).then(done).catch(function () { if (msg) msg.textContent = 'Copy failed.'; });
      } else if (msg) { msg.textContent = 'Clipboard unavailable.'; }
    }
  </script>
