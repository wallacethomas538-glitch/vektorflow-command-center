</button>

<span class="material-symbols-outlined text-[18px]">photo_library</span>
<span class="font-label-mono-md text-label-mono-md tracking-wider">CREATE AD</span>
</button>

<!-- Telemetry Filter Segmented Track -->
<div class="relative w-full p-1 bg-surface-container-lowest rounded-xl flex items-center justify-between shadow-inner">
<button class="filter-tab flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 bg-surface-container-high text-primary-container shadow-[0_0_12px_rgba(0,229,255,0.25)] transition-all" onclick="setFilter('all', this)">
<span class="font-label-mono-sm text-label-mono-sm font-semibold tracking-wider">ALL</span>
<span class="px-1.5 py-0.2 rounded-full bg-primary-container/20 text-primary text-[10px] font-mono" id="filter-count-all">–</span>
</button>
<button class="filter-tab flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-all" onclick="setFilter('active', this)">
<span class="font-label-mono-sm text-label-mono-sm font-semibold tracking-wider">ACTIVE</span>
<span class="px-1.5 py-0.2 rounded-full bg-surface-container text-outline text-[10px] font-mono" id="filter-count-active">–</span>
</button>
<button class="filter-tab flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-all" onclick="setFilter('queued', this)">
<span class="font-label-mono-sm text-label-mono-sm font-semibold tracking-wider">QUEUED</span>
<span class="px-1.5 py-0.2 rounded-full bg-surface-container text-outline text-[10px] font-mono" id="filter-count-queued">–</span>
</button>
<button class="filter-tab flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-all" onclick="setFilter('completed', this)">
<span class="font-label-mono-sm text-label-mono-sm font-semibold tracking-wider">DONE</span>
<span class="px-1.5 py-0.2 rounded-full bg-surface-container text-outline text-[10px] font-mono" id="filter-count-done">–</span>
</button>
</div>
<!-- Mission Cards Stack (real backend data from /api/tasks) -->
<div class="flex flex-col space-y-space-md" id="missionsList">
<div class="font-label-mono-sm text-label-mono-sm text-outline p-space-md">Loading missions…</div>
</div>
<!-- New Mission Modal (real dispatch via POST /api/agents/run) -->
<div id="mission-modal" class="fixed inset-0 z-50 hidden items-center justify-center px-margin">
<div class="absolute inset-0 bg-surface-container-lowest/85 backdrop-blur-md" onclick="closeMissionModal()"></div>
<div class="relative w-full max-w-md bg-surface-container-low rounded-2xl p-space-md shadow-[0_24px_48px_rgba(0,0,0,0.8)] flex flex-col gap-space-sm" style="border: 1px solid rgba(0,229,255,0.25);">
<div class="flex items-center justify-between">
<span class="font-headline-sm text-headline-sm text-primary uppercase tracking-tight">Initialize Mission</span>
<button class="text-outline hover:text-on-surface" onclick="closeMissionModal()" aria-label="Close"><span class="material-symbols-outlined text-[22px]">close</span></button>
</div>
<label class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-wider" for="mission-goal">Mission goal</label>
<textarea id="mission-goal" rows="3" placeholder="Describe the mission goal for the agent team…" class="w-full bg-surface-container-lowest rounded-xl p-space-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none" style="border: 1px solid rgba(0,229,255,0.2);"></textarea>
<div id="mission-result" class="font-label-mono-sm text-label-mono-sm"></div>
<div class="flex gap-space-sm">
<button class="flex-1 h-11 rounded-xl bg-surface-container text-on-surface font-label-mono-md text-label-mono-md tracking-wider" onclick="closeMissionModal()" type="button">CANCEL</button>
<button class="flex-1 h-11 rounded-xl bg-primary-container text-on-primary font-headline-sm text-headline-sm font-bold shadow-[0_0_16px_rgba(0,229,255,0.4)] active:scale-95 transition-all" id="mission-dispatch-btn" onclick="dispatchMission()" type="button">DISPATCH</button>
</div>
<p class="font-label-mono-sm text-label-mono-sm text-outline">Dispatches the agent team via POST /api/agents/run. This can take a minute or more.</p>
</div>
</div>
<!-- Tactical Floating Action Button (FAB) -->
<div class="fixed right-4 bottom-24 z-40">
<div class="relative flex items-center justify-center">
<!-- Pulsing Aura Ring -->
<div class="absolute w-16 h-16 rounded-full bg-primary-container/20 animate-ping pointer-events-none"></div>
<!-- Primary FAB Trigger -->
<button class="relative flex items-center gap-2 h-13 pl-4 pr-5 rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm shadow-[0_0_24px_rgba(0,229,255,0.6)] active:scale-95 transition-all" onclick="openMissionModal()">
<span class="material-symbols-outlined text-[22px] font-bold">add</span>
<span class="font-headline-sm text-headline-sm uppercase tracking-wider text-[14px] font-bold">New Mission</span>
</button>

<!-- Mission Wiring (real backend data) -->
<script>
    function setFilter(type, btn) {
      document.querySelectorAll('.filter-tab').forEach(function (el) {
        el.className = 'filter-tab flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-all';
      });
      btn.className = 'filter-tab flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 bg-surface-container-high text-primary-container shadow-[0_0_12px_rgba(0,229,255,0.25)] transition-all';
      document.querySelectorAll('#missionsList > div').forEach(function (card) {
        var status = card.getAttribute('data-status');
        card.style.display = (type === 'all' || status === type) ? 'block' : 'none';
      });
    }

    function openMissionModal() {
      if (navigator.vibrate) navigator.vibrate(30);
      var m = document.getElementById('mission-modal');
      m.classList.remove('hidden'); m.classList.add('flex');
      document.getElementById('mission-result').innerHTML = '';
      setTimeout(function () { document.getElementById('mission-goal').focus(); }, 50);
    }
    function closeMissionModal() {
      var m = document.getElementById('mission-modal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }
    function dispatchMission() {
      var V = window.VF;
      var goal = document.getElementById('mission-goal').value.trim();
      var out = document.getElementById('mission-result');
      var btn = document.getElementById('mission-dispatch-btn');
      if (!goal) { out.innerHTML = '<span class="text-error">Describe the mission goal first.</span>'; return; }
      btn.disabled = true; btn.textContent = 'DISPATCHING…';
      out.innerHTML = '<span class="text-primary-container">Dispatching agent team…</span>';
      V.vfPost('/api/agents/run', { goal: goal, email: 'commander@vektorflow.com' }, { timeout: 180000 }).then(function (d) {
        btn.disabled = false; btn.textContent = 'DISPATCH';
        out.innerHTML = '<span class="text-tertiary">Mission dispatched.</span>'
          + '<pre class="mt-2 p-2 rounded bg-surface-container-lowest text-on-surface-variant overflow-x-auto" style="white-space: pre-wrap;">' + V.vfEscapeHtml(V.vfResultText(d)).slice(0, 2000) + '</pre>';
        loadMissions();
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = 'DISPATCH';
        out.innerHTML = '<span class="text-error">' + V.vfEscapeHtml(e.message) + '</span>';
      });
    }

    function statusMeta(st) {
      if (st === 'completed') return { key: 'completed', label: 'COMPLETED', edge: 'bg-tertiary-container shadow-[0_0_12px_#22ef7e]', pill: 'bg-tertiary-container/10', dot: 'text-tertiary-container' };
      if (st === 'in_progress') return { key: 'active', label: 'ACTIVE', edge: 'bg-primary-container shadow-[0_0_12px_#00e5ff]', pill: 'bg-primary-container/10', dot: 'text-primary-container' };
      return { key: 'queued', label: 'QUEUED', edge: 'bg-[#ffb300] shadow-[0_0_12px_rgba(255,179,0,0.8)]', pill: 'bg-[#ffb300]/10', dot: 'text-[#ffb300]' };
    }
    function setCount(id, n) { var el = document.getElementById(id); if (el) el.textContent = String(n); }

    function loadMissions() {
      var V = window.VF;
      V.vfGet('/api/tasks').then(function (d) {
        var tasks = d.tasks || [];
        var active = tasks.filter(function (t) { return t.status === 'in_progress'; }).length;
        var queued = tasks.filter(function (t) { return t.status === 'pending'; }).length;
        var done = tasks.filter(function (t) { return t.status === 'completed'; }).length;
        setCount('filter-count-all', tasks.length);
        setCount('filter-count-active', active);
        setCount('filter-count-queued', queued);
        setCount('filter-count-done', done);
        var pill = document.getElementById('ops-pill');
        if (pill) pill.textContent = (active + queued) + ' ACTIVE OPS';
        var list = document.getElementById('missionsList');
        if (list) {
          list.innerHTML = tasks.length ? tasks.map(function (t) {
            var m = statusMeta(t.status);
            return '<div class="relative rounded-2xl bg-surface-container/70 backdrop-blur-md p-space-md shadow-[0_8px_32px_0_rgba(0,0,0,0.45)] overflow-hidden" data-status="' + m.key + '">'
              + '<div class="absolute left-0 top-0 bottom-0 w-1.5 ' + m.edge + '"></div>'
              + '<div class="flex flex-col pl-2 space-y-space-sm">'
              + '<div class="flex items-center justify-between gap-space-sm">'
              + '<span class="font-label-mono-md text-label-mono-md text-on-surface font-semibold tracking-wider">TASK #' + V.vfEscapeHtml(String(t.id)) + '</span>'
              + '<div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full ' + m.pill + '">'
              + '<div class="w-1.5 h-1.5 rounded-full bg-current ' + m.dot + ' animate-pulse"></div>'
              + '<span class="font-label-mono-sm text-label-mono-sm ' + m.dot + ' font-bold tracking-widest">' + m.label + '</span>'
              + '</div></div>'
              + '<h3 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">' + V.vfEscapeHtml(t.title) + '</h3>'
              + '</div></div>';
          }).join("") : '<div class="font-label-mono-sm text-label-mono-sm text-outline p-space-md">No missions on the backend.</div>';
        }
      }).catch(function (e) {
        var list = document.getElementById('missionsList');
        if (list) list.innerHTML = '<div class="p-space-md text-error font-label-mono-sm text-label-mono-sm">Couldn\'t reach backend — <button class="underline text-primary-container" onclick="location.reload()">retry</button><div class="text-outline mt-1">' + window.VF.vfEscapeHtml(e.message) + '</div></div>';
        var pill = document.getElementById('ops-pill');
        if (pill) pill.textContent = 'OFFLINE';
      });
    }
    loadMissions();
  </script>
