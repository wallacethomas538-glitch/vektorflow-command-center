  </head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/80 backdrop-blur-xl shadow-[0_4px_24px_rgba(0,0,0,0.6)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><img alt="VektorFlow Logo" class="h-8 w-auto object-contain shrink-0" src="assets/vektorflow-logo-pro.webp"/><div class="flex flex-col min-w-0"><div class="flex items-center gap-space-xs"><span class="font-headline-sm text-headline-sm tracking-wider uppercase text-primary truncate">VEKTORFLOW</span><div class="h-1.5 w-1.5 rounded-full bg-tertiary-container animate-pulse shadow-[0_0_8px_#22ef7e]"></div></div><span class="font-label-mono-sm text-label-mono-sm uppercase text-outline tracking-widest truncate">SYS: Results</span></div></div><div class="flex items-center gap-space-sm shrink-0"><div class="flex items-center gap-space-xs bg-surface-container px-space-xs py-0.5 rounded-full shadow-[inset_0_1px_0_0_rgba(0,229,255,0.15)]"><span class="font-label-mono-sm text-label-mono-sm text-tertiary-fixed-dim uppercase px-1" id="backend-status-text">…</span></div><div class="relative flex items-center justify-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover shadow-[0_0_10px_rgba(0,229,255,0.25)]" src="assets/vektormind-avatar.png"/><div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-tertiary-container rounded-full ring-2 ring-surface-container-lowest"></div></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-28 bg-surface"><div class="flex flex-col w-full px-margin space-y-space-md"><!-- Tactical Header -->
<div class="flex items-end justify-between pt-space-sm">
<div class="flex flex-col">
<div class="flex items-center gap-space-xs text-primary-fixed-dim">
<span class="material-symbols-outlined text-[16px] animate-pulse">analytics</span>
<span class="font-label-mono-sm text-label-mono-sm tracking-widest uppercase">OUTPUT // AGENT RUNS</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight uppercase">WORKFLOW RESULTS</h2>
</div>
<button onclick="loadResults(true)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-low text-primary-container shadow-md active:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]" id="refresh-icon">refresh</span>
<span class="font-label-mono-sm text-label-mono-sm tracking-wider">REFRESH</span>
</button>
</div>
<div class="flex items-center justify-between px-1">
<span class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-widest" id="results-meta">CONNECTING…</span>
<span class="font-label-mono-sm text-label-mono-sm text-primary-fixed-dim uppercase tracking-widest">AUTO 15S</span>
</div>
<!-- Agent Filter Chips -->
<div class="flex flex-wrap gap-space-xs" id="agent-filters">
<button class="filter-chip px-3 py-1.5 rounded-full bg-primary-container/15 text-primary-container font-label-mono-sm text-label-mono-sm tracking-wider" data-agent="all" onclick="setAgentFilter('all', this)">ALL</button>
</div>
<!-- Results Stack (real backend data from /api/memory) -->
<div class="flex flex-col space-y-space-md" id="resultsList">
<div class="font-label-mono-sm text-label-mono-sm text-outline p-space-md">Loading workflow results…</div>
</div>
<!-- Results Wiring (real backend data) -->
<script>
    var currentFilter = 'all';
    var cachedResults = [];
    var refreshTimer = null;

    function agentNameFromKey(key) {
      var m = /^agent_(.+)_result$/.exec(key || '');
      return m ? m[1] : null;
    }
    function parseValue(v) {
      if (typeof v !== 'string') return v;
      try { return JSON.parse(v); } catch (e) { return v; }
    }
    function fmtTime(ts) {
      if (!ts) return '—';
      try { return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
      catch (e) { return String(ts); }
    }
    function setAgentFilter(agent, btn) {
      currentFilter = agent;
      document.querySelectorAll('.filter-chip').forEach(function (el) {
        el.className = 'filter-chip px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-mono-sm text-label-mono-sm tracking-wider';
      });
      btn.className = 'filter-chip px-3 py-1.5 rounded-full bg-primary-container/15 text-primary-container font-label-mono-sm text-label-mono-sm tracking-wider';
      renderResults();
    }
    function buildFilters(results) {
      var agents = {};
      results.forEach(function (r) { agents[r.agent] = true; });
      var names = Object.keys(agents).sort();
      var html = '<button class="filter-chip px-3 py-1.5 rounded-full ' + (currentFilter === 'all' ? 'bg-primary-container/15 text-primary-container' : 'bg-surface-container-low text-on-surface-variant') + ' font-label-mono-sm text-label-mono-sm tracking-wider" data-agent="all" onclick="setAgentFilter(\'all\', this)">ALL</button>';
      html += names.map(function (n) {
        var active = currentFilter === n;
        return '<button class="filter-chip px-3 py-1.5 rounded-full ' + (active ? 'bg-primary-container/15 text-primary-container' : 'bg-surface-container-low text-on-surface-variant') + ' font-label-mono-sm text-label-mono-sm tracking-wider" data-agent="' + n + '" onclick="setAgentFilter(\'' + n + '\', this)">' + window.VF.vfEscapeHtml(n.toUpperCase()) + '</button>';
      }).join('');
      document.getElementById('agent-filters').innerHTML = html;
    }
    function renderResults() {
      var V = window.VF;
      var list = document.getElementById('resultsList');
      var items = cachedResults.filter(function (r) { return currentFilter === 'all' || r.agent === currentFilter; });
      if (!items.length) {
        list.innerHTML = '<div class="rounded-xl bg-surface-container-low p-space-md shadow-md"><div class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-widest">No workflow results yet — run a mission first.</div><div class="font-body-sm text-body-sm text-on-surface-variant mt-2">Dispatch a mission from the Missions screen; each agent\'s output lands here.</div></div>';
        return;
      }
      list.innerHTML = items.map(function (r) {
        return '<div class="relative rounded-2xl bg-surface-container/70 backdrop-blur-md p-space-md shadow-[0_8px_32px_0_rgba(0,0,0,0.45)] overflow-hidden">'
          + '<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-primary-container shadow-[0_0_12px_#00e5ff]"></div>'
          + '<div class="flex flex-col pl-2 space-y-space-sm">'
          + '<div class="flex items-center justify-between gap-space-sm">'
          + '<span class="font-label-mono-md text-label-mono-md text-primary-container font-semibold tracking-wider uppercase">' + V.vfEscapeHtml(r.agent) + '</span>'
          + '<span class="font-label-mono-sm text-label-mono-sm text-outline">' + V.vfEscapeHtml(fmtTime(r.ts)) + '</span>'
          + '</div>'
          + '<pre class="font-body-sm text-body-sm text-on-surface-variant overflow-x-auto whitespace-pre-wrap break-words max-h-64 overflow-y-auto">' + V.vfEscapeHtml(V.vfResultText(r.value).slice(0, 4000)) + '</pre>'
          + '</div></div>';
      }).join('');
    }
    function loadResults(manual) {
      var V = window.VF;
      var icon = document.getElementById('refresh-icon');
      if (icon && manual) icon.classList.add('animate-spin');
      V.vfGet('/api/memory').then(function (d) {
        if (icon) icon.classList.remove('animate-spin');
        var hp = document.getElementById('backend-status-text'); if (hp) hp.textContent = 'ONLINE';
        var items = d.items || [];
        if (!Array.isArray(items)) {
          // Defensive: backend may return a dict keyed by memory key
          items = Object.keys(items).map(function (k) { return { memory_key: k, memory_value: items[k] }; });
        }
        var results = [];
        items.forEach(function (it) {
          var key = it.memory_key || it.key || '';
          var agent = agentNameFromKey(key);
          if (!agent) return;
          results.push({
            agent: agent,
            ts: it.source_fetched_at || it.timestamp || (it.metadata && it.metadata.fetched_at) || '',
            value: parseValue(it.memory_value !== undefined ? it.memory_value : it.value)
          });
        });
        cachedResults = results;
        if (currentFilter !== 'all' && !results.some(function (r) { return r.agent === currentFilter; })) currentFilter = 'all';
        buildFilters(results);
        renderResults();
        var meta = document.getElementById('results-meta');
        if (meta) meta.textContent = results.length + ' RESULT' + (results.length === 1 ? '' : 'S') + ' • ' + V.vfEscapeHtml(d.backend || 'memory');
      }).catch(function (e) {
        if (icon) icon.classList.remove('animate-spin');
        var hp = document.getElementById('backend-status-text'); if (hp) hp.textContent = 'OFFLINE';
        document.getElementById('resultsList').innerHTML = '<div class="p-space-md text-error font-label-mono-sm text-label-mono-sm">Couldn\'t reach backend — <button class="underline text-primary-container" onclick="loadResults(true)">retry</button><div class="text-outline mt-1">' + window.VF.vfEscapeHtml(e.message) + '</div></div>';
      });
    }
    function startAutoRefresh() {
      stopAutoRefresh();
      refreshTimer = setInterval(function () {
        if (!document.hidden) loadResults(false);
      }, 15000);
    }
    function stopAutoRefresh() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopAutoRefresh(); else { loadResults(false); startAutoRefresh(); }
    });
    window.addEventListener('pagehide', stopAutoRefresh);
    loadResults(false);
    startAutoRefresh();
  </script>
</div></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-2xl shadow-[0_-4px_20px_rgba(0,0,0,0.7)]" data-active-classes="text-primary-container drop-shadow-[0_0_12px_rgba(0,229,255,0.8)]"><div class="h-16 px-space-sm flex items-center justify-around"><a class="flex flex-col items-center justify-center w-16 h-12 gap-0.5 text-outline hover:text-on-surface transition-all" data-path="home" href="home.html"><span class="material-symbols-outlined text-[24px]">dashboard</span><span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider">Home</span></a><a class="flex flex-col items-center justify-center w-16 h-12 gap-0.5 text-outline hover:text-on-surface transition-all" data-path="agents" href="agents.html"><span class="material-symbols-outlined text-[24px]">hub</span><span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider">Agents</span></a><a class="flex flex-col items-center justify-center w-16 h-12 gap-0.5 text-outline hover:text-on-surface transition-all" data-path="chat" href="chat.html"><span class="material-symbols-outlined text-[24px]">terminal</span><span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider">Chat</span></a><a class="flex flex-col items-center justify-center w-16 h-12 gap-0.5 text-outline hover:text-on-surface transition-all" data-path="missions" href="missions.html"><span class="material-symbols-outlined text-[24px]">save_as</span><span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider">Missions</span></a><a class="flex flex-col items-center justify-center w-16 h-12 gap-0.5 text-outline hover:text-on-surface transition-all" data-path="hermes" href="hermes.html"><span class="material-symbols-outlined text-[24px]">smart_toy</span><span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider">Hermes</span></a><a class="flex flex-col items-center justify-center w-16 h-12 gap-0.5 text-outline hover:text-on-surface transition-all" data-path="inventory" href="inventory.html"><span class="material-symbols-outlined text-[24px]">inventory_2</span><span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider">Stock</span></a></div></nav></body></html>
