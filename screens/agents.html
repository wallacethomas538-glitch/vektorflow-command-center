<script>
  function toggleDetails(nodeKey) {
    const details = document.getElementById('details-' + nodeKey);
    const icon = document.getElementById('icon-' + nodeKey);
    if (!details || !icon) return;
    
    if (details.classList.contains('hidden')) {
      details.classList.remove('hidden');
      icon.style.transform = 'rotate(180deg)';
    } else {
      details.classList.add('hidden');
      icon.style.transform = 'rotate(0deg)';
    }
  }
</script><script>

  }
  function card(a) {

    }).join("");
    var key = V.vfEscapeHtml(a.name);

      + '<div class="flex items-center gap-space-sm min-w-0">'
      + '<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center text-primary-container shrink-0 shadow-[0_0_12px_rgba(0,229,255,0.2)]">'

      + '<span class="material-symbols-outlined text-outline text-[20px] transition-transform duration-200" id="icon-' + key + '">expand_more</span>'
      + '</div></div>'

      + '<a href="agent-terminal.html?name=' + encodeURIComponent(a.name) + '" class="font-label-mono-sm text-label-mono-sm text-tertiary flex items-center gap-0.5"><span>Open Terminal</span><span class="material-symbols-outlined text-[14px]">terminal</span></a>'
      + '</div></div></div>';
  }
  var t0 = performance.now();
  V.vfGet("/api/agents").then(function (d) {
    var agents = d.agents || [];

      setText("backend-ver-val", "Backend: v" + (info.version || "?"));
      setText("mesh-ver", "BACKEND v" + (info.version || "?"));
    }).catch(function () {});
  }).catch(function (e) {

  });
})();
